name: CI and Security
run-name: >-
  CI | ${{ github.event_name == 'pull_request'
    && format('PR #{0} | {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('{0} | {1}', github.event_name, github.ref_name) }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read # Read repository contents

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check required site files
        run: |
          cd src
          test -f index.html
          test -f styles.css
          test -f script.js
          grep -q '<!doctype html>' index.html
          grep -q 'script.js' index.html

      - name: Require feature branch pull requests
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          case "$BRANCH_NAME" in
            feature/*) ;;
            *) echo "Pull requests must come from a feature/* branch"; exit 1 ;;
          esac

      - name: Check JavaScript syntax
        run: node --check src/script.js

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-security:
    name: Review workflow security
    permissions:
      security-events: write # Update sec events
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan GitHub Actions workflows
        uses: zizmorcore/zizmor-action@v0.2.0
        with:
          persona: pedantic
