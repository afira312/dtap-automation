name: "Terraform Plan"
run-name: >-
  Terraform plan | ${{ inputs.environment || 'dev' }} | ${{ github.event_name == 'pull_request'
    && format('PR #{0}', github.event.pull_request.number)
    || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      instanceDirectory:
        description: 'Terraform instance directory for single-page application'
        required: true
        default: './iac'
      environment:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: tfplan-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan-template.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      instance_directory: ${{ inputs.instanceDirectory || './iac' }}
    secrets: inherit
