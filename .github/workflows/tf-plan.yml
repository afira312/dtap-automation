name: "Terraform Plan"
run-name: Terraform Plan for (${{ inputs.environment || 'dev'}})

on:
  workflow_dispatch:
    inputs:
      instanceDirectory:
        description: 'Terraform instance directory for single-page application'
        required: true
        default: './iac'
      environment:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_WARN_OUTPUT_ERRORS: true
  TF_WORKING_DIR: ${{ inputs.instanceDirectory || './iac'}}
  TF_ENVIRONMENT: ${{ inputs.environment || 'dev' }}

permissions:
  contents: read #read repository content

concurrency:
  group: tfplan-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    name: "Plan"
    permissions:
      id-token: write # write id-tokens
    #environment: Development
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4 #dfe3c3f305bd9e0a4732411b2eb6d3f28e3a3d40 # v4.0.1

      - name: 'Az CLI login'
        uses: azure/login@v3 #a641126bf300e5efb8e46cf07d7ceebfe5ec4fd0 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          case "$TF_ENVIRONMENT" in
            dev|prod) ;;
            *)
              echo "TF_ENVIRONMENT must be dev or prod, got: $TF_ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          terraform init -backend-config="$TF_ENVIRONMENT/$TF_ENVIRONMENT.tfbackend" -input=false
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          case "$TF_ENVIRONMENT" in
            dev|prod) ;;
            *)
              echo "TF_ENVIRONMENT must be dev or prod, got: $TF_ENVIRONMENT" >&2
              exit 1
              ;;
          esac
          terraform plan -input=false -detailed-exitcode -var-file="$TF_ENVIRONMENT/$TF_ENVIRONMENT.tfvars" -out=planfile
          echo "Installing tf-summarize via go..."
          go install github.com/dineshba/tf-summarize@latest >/dev/null 2>&1
          terraform show -json planfile | $HOME/go/bin/tf-summarize
          terraform show -json planfile | $HOME/go/bin/tf-summarize -tree
