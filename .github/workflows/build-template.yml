name: Build app

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing deployment configuration
        required: true
        type: string
      environment_code:
        description: Short environment code used in the package name; production builds should follow deployment of development
        required: true
        type: string
      source_directory:
        description: Directory to package, relative to the repository root
        required: false
        type: string
        default: src
      artifact_prefix:
        description: Prefix for the package filename, before the environment code and timestamp
        required: false
        type: string
        default: site
      update_environment_tag:
        description: Whether to inject the environment name into the site's index.html environment tag
        required: false
        type: boolean
        default: true
    outputs:
      package_name:
        description: Name of the ZIP package uploaded to blob storage
        value: ${{ jobs.build.outputs.package_name }}

env:
  AZURE_STORAGE_CONTAINER: release

jobs:
  build:
    name: ${{ inputs.environment_code }}-build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
    permissions:
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.environment_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate timestamp
        id: ts
        run: echo "formattedDate=$(date +'%y%m%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Update environment in site
        if: ${{ inputs.update_environment_tag }}
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: sed -i "s/<span class=\"environment-tag\">[^<]*/<span class=\"environment-tag\">${ENVIRONMENT}/" src/index.html

      - name: Package app
        id: package
        env:
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          ARTIFACT_NAME: ${{ inputs.artifact_prefix }}-${{ inputs.environment_code }}-${{ steps.ts.outputs.formattedDate }}.zip
        run: |
          (cd "./${SOURCE_DIRECTORY}" && zip -r "$GITHUB_WORKSPACE/${ARTIFACT_NAME}" .)
          echo "package_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to blob
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --container-name "${{ env.AZURE_STORAGE_CONTAINER }}" \
              --name "${{ steps.package.outputs.package_name }}" \
              --file "${{ steps.package.outputs.package_name }}" \
              --auth-mode login \
              --overwrite
