name: Build app

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing deployment configuration
        required: true
        type: string
      environment_code:
        description: Short environment code used in the package name; production builds should follow deployment of development
        required: true
        type: string
      source_directory:
        description: Directory to package, relative to the repository root
        required: false
        type: string
        default: src
      artifact_prefix:
        description: Prefix for the package filename, before the environment code and timestamp
        required: false
        type: string
        default: site
      update_environment_tag:
        description: Whether to inject the environment name into the site's index.html environment tag
        required: false
        type: boolean
        default: true
      deployment_manifest_path:
        description: Optional manifest path, relative to source_directory, containing the build's GitHub and artifact identity
        required: false
        type: string
        default: ''
    outputs:
      package_name:
        description: Name of the ZIP package uploaded to blob storage
        value: ${{ jobs.build.outputs.package_name }}

env:
  AZURE_STORAGE_CONTAINER: release

jobs:
  build:
    name: ${{ inputs.environment_code }}-build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
    permissions:
      id-token: write
    env:
      TF_ENVIRONMENT: ${{ inputs.environment_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate timestamp
        id: ts
        run: echo "formattedDate=$(date +'%y%m%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Write deployment manifest
        if: ${{ inputs.deployment_manifest_path != '' }}
        env:
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          MANIFEST_PATH: ${{ inputs.deployment_manifest_path }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          ENVIRONMENT_CODE: ${{ inputs.environment_code }}
          PACKAGE_NAME: ${{ inputs.artifact_prefix }}-${{ inputs.environment_code }}-${{ steps.ts.outputs.formattedDate }}.zip
          COMMIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIRECTORY"])
          relative_path = Path(os.environ["MANIFEST_PATH"])
          if relative_path.is_absolute() or ".." in relative_path.parts:
              raise SystemExit("deployment_manifest_path must stay inside source_directory")

          manifest = {
              "environment": os.environ["ENVIRONMENT_NAME"],
              "environment_code": os.environ["ENVIRONMENT_CODE"],
              "package_name": os.environ["PACKAGE_NAME"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "ref": os.environ["GIT_REF"],
              "repository": os.environ["REPOSITORY"],
              "workflow_run_id": os.environ["RUN_ID"],
              "workflow_run_attempt": os.environ["RUN_ATTEMPT"],
              "workflow_run_url": os.environ["RUN_URL"],
              "built_at_utc": datetime.now(timezone.utc).isoformat()
          }
          destination = source / relative_path
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Update environment in site
        if: ${{ inputs.update_environment_tag }}
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: sed -i "s/<span class=\"environment-tag\">[^<]*/<span class=\"environment-tag\">${ENVIRONMENT}/" src/index.html

      - name: Package app
        id: package
        env:
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          ARTIFACT_NAME: ${{ inputs.artifact_prefix }}-${{ inputs.environment_code }}-${{ steps.ts.outputs.formattedDate }}.zip
        run: |
          (cd "./${SOURCE_DIRECTORY}" && zip -r "$GITHUB_WORKSPACE/${ARTIFACT_NAME}" .)
          echo "package_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to blob
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --container-name "${{ env.AZURE_STORAGE_CONTAINER }}" \
              --name "${{ steps.package.outputs.package_name }}" \
              --file "${{ steps.package.outputs.package_name }}" \
              --auth-mode login \
              --overwrite
