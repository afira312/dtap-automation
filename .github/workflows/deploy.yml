name: Deploy DTAP application

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      TF_ENVIRONMENT:
        description: Environment to deploy
        required: true
        default: dev
      APP_SERVICE_NAME:
        description: Azure App Service name
        required: true
        default: ah-poc-dtap-dev-app

permissions:
  contents: read

concurrency:
  group: dtap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev-build:
    name: dev-build
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      id-token: write
    env:
      TF_ENVIRONMENT: dev
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update environment in site
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: sed -i "s/<span class=\"environment-tag\">[^<]*/<span class=\"environment-tag\">${ENVIRONMENT}/" src/index.html

      - name: Upload to blob
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --destination '$web' \
              --source ./src \
              --auth-mode login \
              --overwrite

  prod-build:
    name: prod-build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
    env:
      TF_ENVIRONMENT: prod
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update environment in site
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: sed -i "s/<span class=\"environment-tag\">[^<]*/<span class=\"environment-tag\">${ENVIRONMENT}/" src/index.html

      - name: Upload to blob
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --destination '$web' \
              --source ./src \
              --auth-mode login \
              --overwrite

  dev-deploy:
    name: dev-deploy
    needs: dev-build
    runs-on: ubuntu-latest
    environment: Development
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update environment in site
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: sed -i "s/<span class=\"environment-tag\">[^<]*/<span class=\"environment-tag\">${ENVIRONMENT}/" src/index.html

      - name: Deploy to AppService
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.APP_SERVICE_NAME || 'ah-poc-dtap-dev-app' }}
          package: ./src

  prod-deploy:
    name: prod-deploy
    needs: prod-build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update environment in site
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: sed -i "s/<span class=\"environment-tag\">[^<]*/<span class=\"environment-tag\">${ENVIRONMENT}/" src/index.html

      - name: Deploy to AppService
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.APP_SERVICE_NAME && replace(inputs.APP_SERVICE_NAME, 'dev', 'prod') || 'ah-poc-dtap-prod-app' }}
          package: ./src
