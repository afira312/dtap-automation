name: Deploy site

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing deployment configuration
        required: true
        type: string
      package_name:
        description: Name of the ZIP package uploaded by the preceding build workflow
        required: true
        type: string

env:
  AZURE_STORAGE_CONTAINER: release

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate package name
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          if [[ ! "$PACKAGE_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.zip$ ]]; then
            echo "package_name must be a ZIP artifact filename without a path" >&2
            exit 1
          fi

      - name: Download package from blob
        uses: azure/cli@v2
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        with:
          inlineScript: |
            az storage blob download \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --container-name "${{ env.AZURE_STORAGE_CONTAINER }}" \
              --name "$PACKAGE_NAME" \
              --file "$PACKAGE_NAME" \
              --auth-mode login \
              --overwrite

      - name: Deploy to WebApp
        uses: azure/webapps-deploy@v3
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          package: ./${{ env.PACKAGE_NAME }}