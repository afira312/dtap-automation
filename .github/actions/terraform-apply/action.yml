name: Terraform apply
description: Initialize, validate, plan, summarize, and apply a Terraform configuration.
inputs:
  working-directory:
    description: Terraform working directory.
    required: true
  environment:
    description: Terraform environment name.
    required: true
  azure-client-id:
    description: Azure federated credential client ID.
    required: true
  azure-tenant-id:
    description: Azure tenant ID.
    required: true
  azure-subscription-id:
    description: Azure subscription ID.
    required: true
runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4 # v4.0.1

    - name: Azure CLI login
      uses: azure/login@v3 # v3.1.0
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$TF_ENVIRONMENT" in
          dev|prod) ;;
          *)
            echo "TF_ENVIRONMENT must be dev or prod, got: $TF_ENVIRONMENT" >&2
            exit 1
            ;;
        esac
        terraform init -backend-config="$TF_ENVIRONMENT/$TF_ENVIRONMENT.tfbackend" -input=false
        terraform validate

    - name: Terraform Plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$TF_ENVIRONMENT" in
          dev|prod) ;;
          *)
            echo "TF_ENVIRONMENT must be dev or prod, got: $TF_ENVIRONMENT" >&2
            exit 1
            ;;
        esac
        terraform plan -input=false -detailed-exitcode -var-file="$TF_ENVIRONMENT/$TF_ENVIRONMENT.tfvars" -out=planfile
        echo "Installing tf-summarize via go..."
        go install github.com/dineshba/tf-summarize@latest >/dev/null 2>&1
        terraform show -json planfile | $HOME/go/bin/tf-summarize
        terraform show -json planfile | $HOME/go/bin/tf-summarize -tree

    - name: Terraform Apply
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        terraform apply -var-file="$TF_ENVIRONMENT/$TF_ENVIRONMENT.tfvars" -input=false planfile
